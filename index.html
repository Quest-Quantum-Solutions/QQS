<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Quantum Solutions</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

      margin: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #b0b0b0;
      background: #101114;
      isolation: isolate;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAwIiBoZWlnaHQ9IjEwMDAiIHZpZXdCb3g9IjAgMCAxNjAwIDEwMDAiPjxkZWZzPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iODAiIGhlaWdodD0iODAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik04MCAwSDBWODAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2MwYzdkMCIgc3Ryb2tlLW9wYWNpdHk9Ii4wMzUiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHBhdGggZmlsbD0iIzBjMGQwZiIgZD0iTTAgMGgxNjAwdjEwMDBIMHoiLz48cGF0aCBmaWxsPSJ1cmwoI2dyaWQpIiBkPSJNMCAwaDE2MDB2MTAwMEgweiIvPjxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2FhYjVjMiIgc3Ryb2tlLXdpZHRoPSIxIj48cmVjdCB4PSIxMDAwIiB5PSIzNTAiIHdpZHRoPSIzMjAiIGhlaWdodD0iMzIwIiBzdHJva2Utb3BhY2l0eT0iLjEyIi8+PHJlY3QgeD0iMTA4MCIgeT0iNDMwIiB3aWR0aD0iMzIwIiBoZWlnaHQ9IjMyMCIgc3Ryb2tlLW9wYWNpdHk9Ii4wOCIvPjxyZWN0IHg9IjExNjAiIHk9IjUxMCIgd2lkdGg9IjMyMCIgaGVpZ2h0PSIzMjAiIHN0cm9rZS1vcGFjaXR5PSIuMDU1Ii8+PHBhdGggZD0iTTkyMCAzNTBoODBtMzIwIDMyMGg4ME0xMDgwIDc1MHY4MCIgc3Ryb2tlLW9wYWNpdHk9Ii4xNSIvPjxwYXRoIGQ9Ik0xNjAgNjgwaDMyMG0tMTYwIDB2MTYwIiBzdHJva2Utb3BhY2l0eT0iLjA3Ii8+PC9nPjxnIGZpbGw9IiNiNWM1ZDciIG9wYWNpdHk9Ii4yNSI+PGNpcmNsZSBjeD0iMTAwMCIgY3k9IjM1MCIgcj0iMiIvPjxjaXJjbGUgY3g9IjEzMjAiIGN5PSI2NzAiIHI9IjIiLz48L2c+PC9zdmc+') no-repeat center center;
      background-size: cover;
      pointer-events: none;
      opacity: 1;
      z-index: -1;
    }

    /* Sidebar */
    .sidebar {
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.4));
      backdrop-filter: blur(8px);
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      position: fixed;
      top: 15%;
      left: 1rem;
      width: 16rem;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .sidebar a.main-link {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: #b0b0b0;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .sidebar a.main-link:hover {
      color: #a9d7f5;
      text-shadow: 0 0 6px #a9d7f5;
    }

    .strategy-link {
      color: #b0b0b0;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }
    .strategy-link:hover {
      color: #a9d7f5;
    }

    main {
      background-color: rgba(255, 255, 255, 0.0);
      backdrop-filter: none;
      margin-top: 6rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      padding: 0 1.5rem;
      transition: all 0.3s ease;
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #b0b0b0;
      font-size: 0.9rem;
      flex-shrink: 0;
      text-align: center;
    }

    footer .copyright {
      margin: 0.2rem 0;
      text-align: center;
    }

    /* Mobile top bar for navigation */
    .mobile-nav {
      display: none;
    }

    @media (max-width: 639px) {
      .sidebar {
        display: none;
      }
      .mobile-nav {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        justify-content: space-around;
        padding: 0.5rem 0;
        z-index: 20;
      }
      .mobile-nav a {
        color: #b0b0b0;
        text-decoration: none;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      .mobile-nav a:hover {
        color: #a9d7f5;
        text-shadow: 0 0 6px #a9d7f5;
      }
    }
  
    #main-content > div {
      background: rgba(14, 15, 18, .72);
      border: 1px solid rgba(200, 212, 225, .14);
      box-shadow: 0 24px 80px rgba(0,0,0,.18);
    }
    .sidebar { background: rgba(14,15,18,.8); border: 1px solid rgba(200,212,225,.12); }
    footer { color: #a9b7c6; }
    @media (max-width: 639px) {
      body::before { background-position: 62% center; }
    }
  </style>
</head>
<body>

  <!-- Desktop Sidebar -->
  <aside class="sidebar sm:flex">
    <a href="#" class="main-link" onclick="showContent('home')">Home</a>
    <a href="#" class="main-link" onclick="showContent('mission')">Mission</a>
    <a href="#" class="main-link" onclick="showContent('strategies')">Strategies</a>
    <a href="#" class="main-link" onclick="showContent('contact')">Contact</a>
  </aside>

  <!-- Mobile Top Navigation -->
  <div class="mobile-nav sm:hidden">
    <a href="#" onclick="showContent('home')">Home</a>
    <a href="#" onclick="showContent('mission')">Mission</a>
    <a href="#" onclick="showContent('strategies')">Strategies</a>
    <a href="#" onclick="showContent('contact')">Contact</a>
  </div>

  <main id="main-content" class="mt-20 sm:mt-16">
    <div class="bg-black bg-opacity-50 backdrop-blur-md p-6 rounded-xl inline-block">
      <h1 class="text-5xl font-extrabold mb-4 text-white drop-shadow-lg">
        Quest Quantum Solutions
      </h1>
      <p class="text-gray-300 text-lg max-w-xl mb-8 drop-shadow">
        Quantitative Research &amp; Proprietary Trading Firm
      </p>
    </div>
  </main>

  <footer>
    <div class="copyright">
      &copy; <span id="year"></span> Quest Quantum Solutions. All rights reserved.
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function showContent(section) {
      const main = document.getElementById('main-content');
      const contentBoxStart = `<div class="bg-black bg-opacity-50 backdrop-blur-md p-6 rounded-xl inline-block">`;
      const contentBoxEnd = `</div>`;
      
      if (section === 'home') {
        main.innerHTML = `
          ${contentBoxStart}
            <h1 class="text-5xl font-extrabold mb-4 text-white drop-shadow-lg">Quest Quantum Solutions</h1>
            <p class="text-gray-300 text-lg max-w-xl mb-8 drop-shadow">Quantitative Research &amp; Proprietary Trading Firm</p>
          ${contentBoxEnd}
        `;
      } else if (section === 'mission') {
        main.innerHTML = `
          ${contentBoxStart}
            <h2 class="text-3xl font-bold mb-4 text-white drop-shadow-lg">Mission</h2>
            <p class="text-gray-300 text-lg max-w-xl mb-8 drop-shadow">Develop and deliver cutting-edge quantitative research and proprietary trading strategies that are robust, risk-aware, and adaptable to complex market conditions.</p>
          ${contentBoxEnd}
        `;
      } else if (section === 'contact') {
        main.innerHTML = `
          ${contentBoxStart}
            <h2 class="text-3xl font-bold mb-4 text-white drop-shadow-lg">Contact</h2>
            <p class="text-gray-300 text-lg max-w-xl mb-8 drop-shadow">info.questquantum@gmail.com</p>
          ${contentBoxEnd}
        `;
      } else if (section === 'strategies') {
        main.innerHTML = `
          ${contentBoxStart}
            <h2 class="text-3xl font-bold mb-4 text-white drop-shadow-lg">Strategies</h2>
            <p class="text-gray-300 text-lg max-w-xl mb-8 drop-shadow">
              <a class="strategy-link" href="#" onclick="return false;">AdaptiveShield-VT18</a>
            </p>
          ${contentBoxEnd}
        `;
      }
    }
  </script>

</body>
</html>
